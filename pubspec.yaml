name: flowrist
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  geocoding: ^5.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  injectable: ^3.0.0
  intl: any
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  location: ^10.0.2
  logger: ^2.6.0
  permission_handler: ^13.0.1
  retrofit: ^4.9.0
  shimmer: ^3.0.0
  shimmer_animation: ^2.2.2+1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  webview_flutter: ^4.13.0
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  injectable_generator: ^3.0.2
  json_serializable: ^6.10.0
  mockito: ^5.4.4
  retrofit_generator: ^10.0.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_Regular.ttf
    - family: FloweryIcons
      fonts:
        - asset: assets/fonts/FloweryIcons.ttf
