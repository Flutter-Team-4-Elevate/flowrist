name: Testing Check Action

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  unit-widget-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Run generator
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run test
        run: flutter test test
      - name: Test Summary
        if: always()
        run: |
          echo "## Flutter Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit and widget tests were executed." >> $GITHUB_STEP_SUMMARY
          echo "See the test step above for detailed results." >> $GITHUB_STEP_SUMMARY